[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-maintenance"
version = "1.0.0"
description = "Home Assistant maintenance checks with verified Apple Reminders delivery"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Home Assistant Maintenance contributors"}]
keywords = ["home-assistant", "apple-reminders", "hermes-agent", "maintenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",

  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
ha-maintenance = "home_maintenance_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
